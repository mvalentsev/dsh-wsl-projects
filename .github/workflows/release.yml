name: release

on:
  push:
    tags: ['v*']

# The release is written with the token this workflow already has; no secret of
# the maintainer's lives in the repository for it.
permissions:
  contents: write

jobs:
  release:
    name: the tag becomes a release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag that is not what main points at would publish something the
      # checks did not pass, so the release refuses to be made from it.
      - name: The tag must be what main points at
        run: |
          head="$(git rev-parse HEAD)"
          main="$(git rev-parse origin/${{ github.event.repository.default_branch }})"
          if [ "$head" != "$main" ]; then
            echo "::error::$GITHUB_REF_NAME is at $head, but main is at $main — a release is made from main's tip, nothing else."
            exit 1
          fi
          version="$(git show HEAD:package.json | sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::$GITHUB_REF_NAME does not name the version in package.json ($version)."
            exit 1
          fi
          echo "$GITHUB_REF_NAME is main's tip and matches package.json"

      # The notes are the changelog's own section for the version, so a release
      # cannot describe something the changelog does not say.
      - name: Take the notes from the changelog
        run: |
          awk -v head="## ${GITHUB_REF_NAME#v}" '
            $0 == head { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md | sed '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::the changelog has no section for $GITHUB_REF_NAME."
            exit 1
          fi
          {
            cat notes.md
            echo
            echo "Full notes: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/$GITHUB_REF_NAME/CHANGELOG.md)"
          } > release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md