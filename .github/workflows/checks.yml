name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # These need nothing but Node and bash, so they run on every push and for every
  # supported Node version.
  offline-checks:
    name: manifest, client, theme, scripts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Manifest and packaging gate
        run: node scripts/check-manifest.mjs

      - name: Client half harness
        run: node scripts/check-client.mjs

      - name: Theme token consistency
        run: node scripts/check-theme-tokens.mjs

      - name: Generated shell scripts parse
        run: node scripts/check-bash.mjs

      - name: Every check that can run here
        run: node scripts/check-all.mjs

      - name: Keep the report, whatever happened
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-report-node-${{ matrix.node }}
          path: check-report.md
          if-no-files-found: ignore

      - name: Packaged plugin installs and starts
        run: node scripts/check-pack.mjs

      - name: Package contents
        run: npm pack --dry-run

  # The rest drive a real distribution and a real browser, so they need a machine
  # with WSL or a local Chromium. They are documented in the README and run by
  # hand; CI would have to fake the very thing these checks exist to observe.
  #
  #   node scripts/check-projects.mjs     project model against a live distribution
  #   node scripts/check-urls.mjs         every offered URL answers over HTTP
  #   node scripts/check-ui.mjs           a browser shows the project it should
  #   node scripts/check-legacy.mjs       a unit from an older version is repaired
  #   node scripts/check-shared-home.mjs  the home decides the project
  #   node scripts/check-readme.mjs       every claim in the readme, with evidence
  #   node scripts/check-alias.mjs        labels round-trip through state()
  #   node scripts/smoke.mjs              the host half end to end
