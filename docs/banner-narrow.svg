<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" role="img" aria-labelledby="title">
<title id="title">dsh-wsl-projects — one DeepSeek Harness web server per project, inside WSL2</title>
<style>
.bg{fill:#f6f8fa;stroke:#d0d7de}
.grid{fill:#afb8c1}
.card{fill:#ffffff}
.b{stroke:#0969da}
.v{stroke:#8250df}
.g{fill:#1a7f37}
.m{fill:#57606e}
.w0{stop-color:#0969da}
.w1{stop-color:#8250df}
.a0{stop-color:#0969da}
.a1{stop-color:#8250df}
@media (prefers-color-scheme: dark){
  .bg{fill:#0d1117;stroke:#262c36}
  .grid{fill:#30363d}
  .card{fill:#161b22}
  .b{stroke:#58a6ff}
  .v{stroke:#a371f7}
  .g{fill:#3fb950}
  .m{fill:#8b949e}
  .w0{stop-color:#58a6ff}
  .w1{stop-color:#d2a8ff}
  .a0{stop-color:#1f6feb}
  .a1{stop-color:#a371f7}
}
</style>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop class="a0" offset="0"/>
    <stop class="a1" offset="1"/>
  </linearGradient>
  <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
    <stop class="w0" offset="0"/>
    <stop class="w1" offset="1"/>
  </linearGradient>
  <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle class="grid" cx="1.4" cy="1.4" r="1.4"/>
  </pattern>
</defs>

<rect class="bg" x="1" y="1" width="598" height="438" rx="18" stroke-width="1.5"/>
<rect x="1" y="1" width="598" height="438" rx="18" fill="url(#grid)"/>

<!-- mark: three stacked services, each alive -->
<g transform="translate(223.5,64)">
  <rect class="card b" x="27" y="0" width="126" height="39" rx="12" stroke-width="2"/>
  <rect class="card v" x="13.5" y="48" width="140" height="39" rx="12" stroke-width="2"/>
  <rect class="card" x="0" y="96" width="153" height="39" rx="12" stroke="url(#accent)" stroke-width="2.2"/>
  <circle class="g" cx="137" cy="19.5" r="6"/>
  <circle class="g" cx="124.5" cy="67.5" r="6"/>
  <circle class="g" cx="137" cy="115.5" r="6"/>
  <polyline class="b" points="18,103 29,116 18,129" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line class="b" x1="37" y1="116" x2="68" y2="116" stroke-width="3.2" stroke-linecap="round"/>
</g>

<text x="300" y="292" text-anchor="middle" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="0.5" fill="url(#wordmark)">dsh-wsl-projects</text>
<text class="m" x="300" y="340" text-anchor="middle" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="24">One DeepSeek Harness web server</text>
<text class="m" x="300" y="372" text-anchor="middle" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="24">per project, inside WSL2</text>
</svg>
