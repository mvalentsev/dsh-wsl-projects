<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="dsh-wsl-projects">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0969da"/>
      <stop offset="1" stop-color="#8250df"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da"/>
      <stop offset="1" stop-color="#8250df"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#afb8c1" opacity="0.5"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="238" rx="18" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="1" y="1" width="1198" height="238" rx="18" fill="url(#grid)"/>

  <!-- mark: three stacked services, each alive -->
  <g transform="translate(549,22)">
    <rect x="18" y="0"  width="84"  height="26" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/>
    <rect x="9"  y="32" width="93"  height="26" rx="8" fill="#ffffff" stroke="#8250df" stroke-width="1.6"/>
    <rect x="0"  y="64" width="102" height="26" rx="8" fill="#ffffff" stroke="url(#accent)" stroke-width="1.8"/>
    <circle cx="91" cy="13" r="4" fill="#1a7f37"/>
    <circle cx="91" cy="45" r="4" fill="#1a7f37"/>
    <circle cx="91" cy="77" r="4" fill="#1a7f37"/>
    <polyline points="12,70 19,77 12,84" fill="none" stroke="#0969da" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="26" y1="77" x2="44" y2="77" stroke="#0969da" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <text x="600" y="168" text-anchor="middle" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="0.5" fill="url(#wordmark)">dsh-wsl-projects</text>
  <text x="600" y="204" text-anchor="middle" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="19" fill="#57606a">One DeepSeek Harness web server per project, inside WSL2</text>
</svg>
