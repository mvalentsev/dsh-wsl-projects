<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="How dsh-wsl-projects lays out services">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="958" height="398" rx="16" fill="#0d1117" stroke="#262c36" stroke-width="1.5"/>

  <!-- Windows side -->
  <rect x="24" y="96" width="250" height="170" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="44" y="122" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="1.1" fill="#8b949e">WINDOWS</text>
  <rect x="109" y="146" width="80" height="56" rx="8" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <line x1="149" y1="146" x2="149" y2="202" stroke="#58a6ff" stroke-width="2"/>
  <line x1="109" y1="174" x2="189" y2="174" stroke="#58a6ff" stroke-width="2"/>
  <text x="149" y="228" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="600" fill="#e6edf3">DeepSeek Harness app</text>
  <text x="149" y="248" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#8b949e">the panel</text>

  <!-- WSL2 side -->
  <rect x="380" y="24" width="556" height="352" rx="14" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="396" y="46" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="1.1" fill="#8b949e">WSL2 · UBUNTU</text>

  <!-- service card 1 -->
  <rect x="400" y="66" width="516" height="76" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="424" y="100" font-family="Segoe UI, Consolas, monospace" font-size="14" fill="#e6edf3">dsh-web-api-gateway</text>
  <text x="424" y="120" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#8b949e">systemctl --user</text>
  <circle cx="710" cy="104" r="4" fill="#3fb950"/>
  <rect x="722" y="88" width="72" height="26" rx="6" fill="#0d1117" stroke="#1f6feb"/>
  <text x="758" y="106" text-anchor="middle" font-family="Segoe UI, Consolas, monospace" font-size="12" fill="#58a6ff">:19800</text>
  <rect x="802" y="88" width="96" height="26" rx="6" fill="#0d1117" stroke="#a371f7"/>
  <text x="850" y="106" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#d2a8ff">own dsh home</text>

  <!-- service card 2 -->
  <rect x="400" y="162" width="516" height="76" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="424" y="196" font-family="Segoe UI, Consolas, monospace" font-size="14" fill="#e6edf3">dsh-web-web-client</text>
  <text x="424" y="216" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#8b949e">systemctl --user</text>
  <circle cx="710" cy="200" r="4" fill="#3fb950"/>
  <rect x="722" y="184" width="72" height="26" rx="6" fill="#0d1117" stroke="#1f6feb"/>
  <text x="758" y="202" text-anchor="middle" font-family="Segoe UI, Consolas, monospace" font-size="12" fill="#58a6ff">:19802</text>
  <rect x="802" y="184" width="96" height="26" rx="6" fill="#0d1117" stroke="#a371f7"/>
  <text x="850" y="202" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#d2a8ff">own dsh home</text>

  <!-- service card 3 -->
  <rect x="400" y="258" width="516" height="76" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="424" y="292" font-family="Segoe UI, Consolas, monospace" font-size="14" fill="#e6edf3">dsh-web-docs-site</text>
  <text x="424" y="312" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#8b949e">systemctl --user</text>
  <circle cx="710" cy="296" r="4" fill="#3fb950"/>
  <rect x="722" y="280" width="72" height="26" rx="6" fill="#0d1117" stroke="#1f6feb"/>
  <text x="758" y="298" text-anchor="middle" font-family="Segoe UI, Consolas, monospace" font-size="12" fill="#58a6ff">:19801</text>
  <rect x="802" y="280" width="96" height="26" rx="6" fill="#0d1117" stroke="#a371f7"/>
  <text x="850" y="298" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#d2a8ff">own dsh home</text>

  <!-- arrows -->
  <path d="M 274 140 C 320 140, 340 104, 396 104" fill="none" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 274 181 C 320 181, 340 200, 396 200" fill="none" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 274 222 C 320 222, 340 296, 396 296" fill="none" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#arrow)"/>

  <text x="480" y="392" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#8b949e">one service · one port · one dsh home — per project</text>
</svg>
