<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" role="img" aria-label="The WSL projects panel">
  <defs>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="898" height="578" rx="16" fill="#0d1117" stroke="#262c36" stroke-width="1.5"/>

  <!-- title bar -->
  <text x="24" y="28" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e6edf3">WSL projects</text>
  <line x1="838" y1="22" x2="850" y2="22" stroke="#8b949e" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="858" y="16" width="11" height="11" rx="2" fill="none" stroke="#8b949e" stroke-width="1.6"/>
  <path d="M 880 16 L 890 26 M 890 16 L 880 26" stroke="#8b949e" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="1" y1="44" x2="899" y2="44" stroke="#21262d" stroke-width="1.5"/>

  <!-- Services -->
  <text x="24" y="72" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.1" fill="#8b949e">Services</text>

  <!-- row: running -->
  <rect x="24" y="84" width="852" height="62" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="48" y="121" font-family="Segoe UI, Consolas, monospace" font-size="15" fill="#58a6ff" text-decoration="underline">api-gateway</text>
  <circle cx="200" cy="115" r="4.5" fill="#3fb950"/>
  <text x="212" y="120" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#3fb950">running</text>
  <text x="560" y="120" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#8b949e">port 19800</text>
  <rect x="654" y="100" width="64" height="30" rx="6" fill="#1f6feb"/>
  <text x="686" y="120" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Open</text>
  <rect x="726" y="100" width="70" height="30" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="761" y="120" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#e6edf3">Restart</text>
  <rect x="802" y="100" width="58" height="30" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="831" y="120" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#e6edf3">Stop</text>

  <!-- row: running -->
  <rect x="24" y="156" width="852" height="62" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="48" y="193" font-family="Segoe UI, Consolas, monospace" font-size="15" fill="#58a6ff" text-decoration="underline">web-client</text>
  <circle cx="200" cy="187" r="4.5" fill="#3fb950"/>
  <text x="212" y="192" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#3fb950">running</text>
  <text x="560" y="192" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#8b949e">port 19802</text>
  <rect x="654" y="172" width="64" height="30" rx="6" fill="#1f6feb"/>
  <text x="686" y="192" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Open</text>
  <rect x="726" y="172" width="70" height="30" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="761" y="192" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#e6edf3">Restart</text>
  <rect x="802" y="172" width="58" height="30" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="831" y="192" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#e6edf3">Stop</text>

  <!-- row: stopped -->
  <rect x="24" y="228" width="852" height="62" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="48" y="265" font-family="Segoe UI, Consolas, monospace" font-size="15" fill="#e6edf3">docs-site</text>
  <circle cx="200" cy="259" r="4.5" fill="#8b949e"/>
  <text x="212" y="264" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#8b949e">stopped</text>
  <text x="560" y="264" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#8b949e">port 19801</text>
  <rect x="654" y="244" width="64" height="30" rx="6" fill="#1f6feb"/>
  <text x="686" y="264" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Start</text>
  <rect x="726" y="244" width="70" height="30" rx="6" fill="#21262d" stroke="#f85149"/>
  <text x="761" y="264" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#f85149">Remove</text>

  <!-- Start a project -->
  <text x="24" y="336" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" letter-spacing="1.1" fill="#8b949e">Start a project</text>

  <rect x="24" y="352" width="380" height="36" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="42" y="375" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-style="italic" fill="#6e7681">filter</text>

  <rect x="24" y="398" width="380" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="42" y="424" font-family="Segoe UI, Consolas, monospace" font-size="14" fill="#e6edf3">~/projects/api-gateway</text>
  <path d="M 376 413 L 384 421 L 392 413" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="24" y="484" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#8b949e">Name</text>
  <rect x="66" y="466" width="210" height="36" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="82" y="489" font-family="Segoe UI, Consolas, monospace" font-size="13" fill="#e6edf3">api-gateway</text>
  <text x="300" y="484" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#8b949e">Port</text>
  <rect x="336" y="466" width="68" height="36" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="352" y="489" font-family="Segoe UI, Consolas, monospace" font-size="13" fill="#e6edf3">19800</text>

  <rect x="24" y="518" width="380" height="44" rx="8" fill="url(#accent2)"/>
  <text x="214" y="545" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Start a service for this project</text>

  <!-- live status footer -->
  <path d="M 806 555 a 7 7 0 1 1 -0.1 0" fill="none" stroke="#3fb950" stroke-width="1.8"/>
  <path d="M 806 551 v 5 l 3.5 2" fill="none" stroke="#3fb950" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="820" y="560" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#8b949e">state, every 5 s</text>
</svg>
