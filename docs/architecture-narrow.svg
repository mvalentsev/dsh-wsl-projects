.chip{fill:#f6f8fa}
.pb{stroke:#0969da}
.pt{fill:#0969da}
.vb{stroke:#8250df}
.vt{fill:#8250df}
.af{fill:#0969da}
@media (prefers-color-scheme: dark){
  .bg{fill:#0d1117;stroke:#262c36}
  .card{fill:#161b22;stroke:#30363d}
  .dash{stroke:#30363d}
  .t{fill:#e6edf3}
  .m{fill:#8b949e}
  .b{stroke:#58a6ff}
  .g{fill:#3fb950}
  .chip{fill:#0d1117}
  .pb{stroke:#1f6feb}
  .pt{fill:#58a6ff}
  .vb{stroke:#a371f7}
