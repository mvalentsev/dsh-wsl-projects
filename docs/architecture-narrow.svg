<svg xmlns="http://www.w3.org/2000/svg" width="560" height="640" viewBox="0 0 560 640" role="img" aria-labelledby="title">
<title id="title">How dsh-wsl-projects lays out services: the Windows app drives one systemd user service, port and dsh home per project inside WSL2</title>
<style>
.bg{fill:#f6f8fa;stroke:#d0d7de}
.card{fill:#ffffff;stroke:#d0d7de}
